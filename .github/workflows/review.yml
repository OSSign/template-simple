# Review workflow of an OSSign mirror repository.
#
# Created from the OSSign mirror template; ossign-server dispatches it for the
# initial review when the mirror is onboarded. It runs the scanners on the
# pinned source commit and uploads their reports to the review. It does not
# build or sign anything and needs no key, policy or environment.
#
# The signing workflow (examples/sign.yml, moved to .github/workflows/sign.yml
# once the initial review is approved) contains the same prepare job; keep the
# two in sync when you change the scanners.
#
# SOURCE_REPO and OSSIGN_SERVER are repository variables set by ossign-server
# during onboarding. Do not hardcode them here.

name: Review

# [REQUIRED] The server finds the run of a dispatch through this title. Keep the
# "[<dispatch_id>]" part exactly; the text before it is free.
run-name: "Review ${{ inputs.ref }} [${{ inputs.dispatch_id }}]"

# [REQUIRED] The four inputs the server passes on workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the source repository as requested
        required: true
      sha:
        description: Commit pinned by ossign-server; the scan uses this, never the moving ref
        required: true
      release_name:
        description: Unused here; passed by the server on every dispatch
        required: true
      dispatch_id:
        description: Dispatch id assigned by ossign-server
        required: true

env:
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  OSSIGN_SERVER: ${{ vars.OSSIGN_SERVER }}

# [REQUIRED] id-token: write gives the job its OIDC token for the upload.
permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # [REQUIRED] Check out the pinned SHA, never the ref. The last line fails
      # the job if the fetch did not return exactly the pinned commit.
      - name: Check out the pinned source commit
        run: |
          git init src
          cd src
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "${{ inputs.sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"

      # [ADAPT] Scanners. Every tool the review rule's scanner step lists under
      # "require" (by default gitleaks and osv-scanner) must produce a report.
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir src --report-format json --report-path gitleaks.json --exit-code 0 --no-banner
          test -s gitleaks.json || echo '[]' > gitleaks.json

      - name: osv-scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.1/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan --recursive --format json --output osv.json src || true
          test -s osv.json || echo '{"results":[]}' > osv.json

      # [REQUIRED] Upload the reports with the job's OIDC token.
      - name: Upload scanner reports to the review
        run: |
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OSSIGN_SERVER" | jq -r .value)
          jq -n --arg sha "${{ inputs.sha }}" \
                --rawfile gitleaks gitleaks.json --rawfile osv osv.json \
                '{sha: $sha, uploads: [
                   {tool: "gitleaks",    format: "json", content: $gitleaks},
                   {tool: "osv-scanner", format: "json", content: $osv}]}' > uploads.json
          curl -sS --fail -X POST -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
            --data @uploads.json "$OSSIGN_SERVER/api/v1/reviews/${{ inputs.dispatch_id }}/uploads"
