# Signing workflow template. Move it to .github/workflows/sign.yml
# once the initial review is approved, then adapt the build and
# the signing steps.
#
# Mirror repository workflow for third-party signing requests.
#
# Lives in the mirror repository (ours), not in the third party's repository.
# It is started by ossign-server when a dispatch client requests a signing:
#   POST /api/v1/dispatch/<client>  { "ref": "v1.2.3" }
# The server resolves the ref to a commit, starts the review, and triggers this
# workflow with the inputs below. The sign job runs in an environment that is
# protected by the OSSign deployment protection rule and is released only when
# the review is approved.
#
# Every block is marked:
#   [DO NOT CHANGE]  the server or the review depends on it; keep it as is
#   [CHANGE-ME]     project specific; replace freely
#   [OPTIONAL]  can be removed without affecting the server

name: Sign release

# [DO NOT CHANGE] The server finds the run of a dispatch through this title. Keep the
# "[<dispatch_id>]" part exactly; the text before it is free.
run-name: "Sign ${{ inputs.ref }} [${{ inputs.dispatch_id }}]"

# [DO NOT CHANGE] These four inputs are what the server passes on workflow_dispatch.
# Add more if you want, never rename or drop these.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the source repository as requested
        required: true
      sha:
        description: Commit pinned by ossign-server; the build uses this, never the moving ref
        required: true
      release_name:
        description: Name of the GitHub release to publish
        required: true
      dispatch_id:
        description: Dispatch id assigned by ossign-server
        required: true

env:
  # [DO NOT CHANGE] Repository variables. SOURCE_REPO and OSSIGN_SERVER are set
  # automatically during onboarding; add OSSIGN_KEY (the key name on the
  # server) under Settings → Secrets and variables → Actions → Variables.
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  OSSIGN_SERVER: ${{ vars.OSSIGN_SERVER }}
  OSSIGN_KEY: ${{ vars.OSSIGN_KEY }}

# [DO NOT CHANGE] id-token: write gives the job its OIDC token (signing and the report fetch).
# contents: write is only needed by the release step at the bottom.
permissions:
  contents: write
  id-token: write

jobs:
  # The review scans the pinned commit on the server (the ossign-scanner
  # service) before this job's environment is released, so the workflow has
  # no scanning job of its own. Which scanners run is part of the review
  # rule, not of this file.

  # ---------------------------------------------------------------------------
  # sign: builds and signs. Blocked by the deployment protection rule until the
  # review is approved.
  # ---------------------------------------------------------------------------
  sign:
    runs-on: ubuntu-latest        # [CHANGE-ME] windows-latest works too; the ossign action supports all three
    environment: signing          # [DO NOT CHANGE] the environment the OSSign protection rule is enabled on
    steps:
      # [DO NOT CHANGE] Same pinned checkout as above. Whatever gets signed must be
      # built from this commit, because this is the commit that was reviewed.
      - name: Check out the pinned source commit
        run: |
          git init src
          cd src
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "${{ inputs.sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"

      # [CHANGE-ME] Toolchain and build. Anything goes, as long as the outputs end
      # up in dist/ for the steps below. Example: a Go project producing two
      # executables.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build executables
        working-directory: src
        run: |
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 go build -o ../dist/project.exe ./cmd/project
          GOOS=windows GOARCH=amd64 go build -o ../dist/project-cli.exe ./cmd/project-cli

      # [DO NOT CHANGE] At least one signing step through the ossign action with
      # tokenType ossignServer; this is what the review approval is for.
      # Multiple steps with different fileType values are fine. The policy on
      # the server may restrict file types; keep them in sync.
      #
      # [CHANGE-ME] fileType and inputFile(s). Files are signed in place; set
      # outputFile only when you want a separate copy.
      - name: Sign executables
        uses: ossign/ossign-action@v1
        with:
          fileType: pecoff
          inputFiles: dist/*.exe
          config: |
            { "tokenType": "ossignServer",
              "ossignServer": { "url": "${{ env.OSSIGN_SERVER }}", "key": "${{ env.OSSIGN_KEY }}",
                                "metadata": { "dispatch": "${{ inputs.dispatch_id }}", "sha": "${{ inputs.sha }}" } } }

      # [CHANGE-ME][OPTIONAL] Second artifact type. Build the installer from the
      # already signed executables, then sign the installer itself.
      - name: Build installer
        run: |
          echo "pack dist/*.exe (already signed) into dist/project.msi with your installer tool"

      - name: Sign installer
        uses: ossign/ossign-action@v1
        with:
          fileType: msi
          inputFile: dist/project.msi
          config: |
            { "tokenType": "ossignServer",
              "ossignServer": { "url": "${{ env.OSSIGN_SERVER }}", "key": "${{ env.OSSIGN_KEY }}",
                                "metadata": { "dispatch": "${{ inputs.dispatch_id }}", "sha": "${{ inputs.sha }}" } } }

      # [OPTIONAL] Sanity check: refuse to publish anything signed with a
      # test-mode certificate (exit code 2) or by the wrong signer.
      - name: Verify signatures
        run: |
          for f in dist/*.exe dist/*.msi; do ossign verify "$f"; done

      # [RECOMMENDED] Fetch the review report bundle (available once the review
      # is decided, which it is by the time this job runs) so it can be
      # published next to the binaries: review-report.json (full report),
      # review-report.md (summary, used as the release body),
      # review-scans.zip (raw scanner output) and review-report.json.p7s
      # (detached signature over the JSON, made with this repository's key).
      - name: Fetch the review report
        run: |
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OSSIGN_SERVER" | jq -r .value)
          mkdir -p review
          for f in review-report.json review-report.md review-scans.zip review-report.json.p7s; do
            curl -sS --fail -H "Authorization: Bearer $OIDC" -o "review/$f" \
              "$OSSIGN_SERVER/api/v1/reviews/${{ inputs.dispatch_id }}/report/$f"
          done

      # [OPTIONAL] Publish. The review summary becomes the release body and the
      # report files are attached. The dispatch status endpoint reports the
      # assets of the latest release to the third party, so if you publish
      # elsewhere (S3, a package feed) they get no asset list from the server.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref }}-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          body_path: review/review-report.md
          files: |
            dist/*.exe
            dist/*.msi
            review/*
